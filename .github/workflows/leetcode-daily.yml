name: Daily LeetCode study archive
on:
  schedule:
    # UTC: 10:00, 14:00 and 20:00 IST. Later runs retry failures only.
    - cron: '30 4,8,14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leetcode-daily
  cancel-in-progress: false
jobs:
  wake-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and commit today's solutions in Hugging Face
        run: python .github/scripts/wake_space.py
